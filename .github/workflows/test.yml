name: Tests

# Läuft bei jedem Pull Request und bei jedem Stand von main: ein kaputter Stand fällt auf, bevor er im Image landet.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
