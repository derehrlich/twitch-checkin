<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stadtwache Chat (klassisch)</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* Klassischer Chat als OBS-Browserquelle (z. B. 560×420, Hintergrund durchsichtig), passend zu den Holz-Szenen.
     Neueste Nachricht unten, ältere rutschen nach oben und blenden oben aus.
     ?demo  Beispielnachrichten   ?scale=1.3  Größe   ?max=6  höchstens so viele Nachrichten   ?alpaka=0  ohne Alpakas */
  :root { --s: 1; --alpaka: calc(44px * var(--s)); --name: calc(1.2rem * var(--s)); --text: calc(1.1rem * var(--s)); --gap: calc(10px * var(--s)); --fade: 22%;
    --plank: rgba(34, 19, 10, .86); --edge: #9a6532; --edge-dark: #2b180c; --glow: rgba(246, 184, 46, .14); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: var(--font); }
  #chat { display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; height: 100vh; padding: 0 calc(8px * var(--s)) calc(8px * var(--s)); box-sizing: border-box;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 var(--fade)); mask-image: linear-gradient(to bottom, transparent, #000 var(--fade)); }
  /* Neue Nachricht wächst von unten auf und schiebt die älteren sanft nach oben */
  .row { display: grid; grid-template-rows: 0fr; max-width: 100%; animation: grow .5s cubic-bezier(.23, 1, .32, 1) forwards; }
  .row > .clip { min-height: 0; overflow: hidden; padding: calc(4px * var(--s)) 4px calc(var(--gap) - 4px * var(--s)) 4px; }
  @keyframes grow { to { grid-template-rows: 1fr; } }
  .bubble { display: flex; align-items: center; gap: 10px; box-sizing: border-box; padding: calc(8px * var(--s)) calc(14px * var(--s)) calc(8px * var(--s)) calc(10px * var(--s)); background: var(--plank);
    /* Kante aus Holz in Pixel-Optik: gestufte Ecken statt runder */
    box-shadow: 0 -3px 0 0 var(--edge), 0 3px 0 0 var(--edge), -3px 0 0 0 var(--edge), 3px 0 0 0 var(--edge), inset 0 3px 0 0 var(--glow), inset 0 -3px 0 0 rgba(0, 0, 0, .35), 0 6px 0 0 var(--edge-dark);
    opacity: 0; animation: in .5s ease-out .1s forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .alpaka { width: var(--alpaka); height: var(--alpaka); flex-shrink: 0; object-fit: contain; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .45)); }
  .noalpaka .alpaka { display: none; }
  .wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; }
  .name { font-family: var(--wordmark); font-weight: 700; font-size: var(--name); line-height: 1.15; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 0 rgba(0, 0, 0, .75); }
  .text { color: #f7e8cc; font-weight: 500; font-size: var(--text); line-height: 1.25; text-shadow: 0 2px 0 rgba(0, 0, 0, .7); display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .text img { height: 1.35em; width: auto; vertical-align: middle; }
  /* Extras (nur Abos und VIPs): Verlauf, und Glitzer als Lichtschein */
  .fx-gradient .name, .fx-gradient .text, .fx-glitter .name, .fx-glitter .text { -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .75)); }
  .fx-gradient .name, .fx-gradient .text { background-image: var(--grad); }
  .fx-glitter .name, .fx-glitter .text { background-image: linear-gradient(100deg, var(--cg) 0%, var(--cg) 35%, #fff 48%, #fff 52%, var(--cg) 65%, var(--cg) 100%); background-size: 250% 100%; animation: sweep 2.4s linear infinite; }
  .fx-gradient.fx-glitter .name, .fx-gradient.fx-glitter .text { background-image: var(--gradglit); }
  @keyframes sweep { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  @media (prefers-reduced-motion: reduce) { .row, .bubble { animation-duration: .01s; animation-delay: 0s; } }
</style>
</head>
<body>
<div id="chat" aria-live="off"></div>
<script src="/chatfx.js"></script>
<script>
const params = new URLSearchParams(location.search);
const scale = Number(params.get('scale'));
if (scale > 0.3 && scale < 5) document.documentElement.style.setProperty('--s', scale);
const chat = document.getElementById('chat');
if (params.get('alpaka') === '0') chat.classList.add('noalpaka');

const SHOWN = new Map(); // Nachrichten-Kennung -> Zeile
let limit = 10;
const own = Number(params.get('max')); // eigene Obergrenze, falls der Platz kleiner ist als die Einstellung im Admin
const cap = () => (own >= 1 ? Math.min(limit, own) : limit);

function build(m) {
  const row = document.createElement('div'); row.className = 'row';
  const clip = document.createElement('div'); clip.className = 'clip';
  const el = document.createElement('div'); el.className = 'bubble';
  const img = document.createElement('img');
  img.className = 'alpaka'; img.alt = ''; img.src = ALPAKAS[hash(String(m.id)) % ALPAKAS.length];
  const wrap = document.createElement('div'); wrap.className = 'wrap';
  const name = document.createElement('span'); name.className = 'name'; name.textContent = m.n + ':';
  const text = document.createElement('span'); text.className = 'text';
  for (const p of m.m) {
    if (p.e) { const e = document.createElement('img'); e.alt = ''; e.src = `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(p.e)}/default/dark/2.0`; text.append(e); }
    else text.append(document.createTextNode(p.x));
  }
  wrap.append(name, text); el.append(img, wrap); clip.append(el); row.append(clip);
  style(el, m);
  return row;
}

const bubbleOf = (row) => row.querySelector('.bubble');
function add(m) { const row = build(m); SHOWN.set(m.id, row); chat.append(row); } // neueste unten
function drop(id) { SHOWN.get(id)?.remove(); SHOWN.delete(id); }
function trim() { // älteste (ganz oben) entfernen, so wächst nichts an
  while (chat.children.length > cap()) { for (const [id, row] of SHOWN) if (row === chat.firstElementChild) { drop(id); break; } }
}

function render(d) {
  const ids = new Set(d.messages.map((m) => m.id));
  for (const m of d.messages) {
    if (!SHOWN.has(m.id)) add(m); // Reihenfolge alt → neu, jede kommt unten dazu
    else if (bubbleOf(SHOWN.get(m.id)).dataset.sig !== sig(m)) style(bubbleOf(SHOWN.get(m.id)), m); // Stil der Person hat sich geändert
  }
  for (const id of [...SHOWN.keys()]) if (!ids.has(id)) drop(id); // abgelaufen oder herausgefallen
  trim();
}

const DEMO = [
  ['Anna', '#ff8fc0', 'Guten Abend zusammen!'], ['Ben', '', 'Das Alpaka-Overlay ist so süß 🦙'],
  ['Cleo', '', 'Wie lang geht der Stream heute? Ich muss morgen früh raus, aber das hier will ich nicht verpassen'], ['Dennis', '#a14ee8', 'GG, das war knapp', 1, 1], ['Fiona', '', 'Hallo aus Hamburg!'],
];
let demoN = 0;
function demo() {
  const [n, c, text, g, s] = DEMO[demoN % DEMO.length];
  add({ id: 'demo' + demoN++, t: Date.now(), n, c, g: Boolean(g), s: Boolean(s), m: [{ x: text }] });
  trim();
}

async function poll() {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000); // hängende Anfrage nicht ewig offen lassen
  try {
    const res = await fetch('/api/chatlog', { cache: 'no-store', signal: ctl.signal });
    if (res.ok) { const d = await res.json(); limit = d.max || limit; render(d); }
  } catch { /* beim nächsten Mal wieder */ }
  finally { clearTimeout(timer); }
}

if (params.has('demo')) { demo(); setInterval(demo, 2500); }
else {
  poll(); setInterval(poll, 2000);
  setTimeout(() => location.reload(), 6 * 3600 * 1000); // Sicherheitsnetz für lange Streams: alle 6 Stunden sauber neu laden
}
</script>
</body>
</html>
