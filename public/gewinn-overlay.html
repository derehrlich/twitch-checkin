<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Geburtstags-Ziehung (OBS)</title>
<style>
  @font-face { font-family: 'Pixelify'; src: url('/fonts/pixelify-sans-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: 'Pixelify', monospace; color: #f6ead2; }
  #board { position: fixed; left: 50%; top: 80px; transform: translateX(-50%); width: 900px; display: none; }
  #board.on { display: block; animation: pop .5s steps(6) both; }
  @keyframes pop { from { transform: translateX(-50%) scale(.85); opacity: 0; } }
  .frame { background: #3b2a1a; border: 6px solid #1f150c; box-shadow: 0 0 0 4px #7a5530, 8px 8px 0 #0006; padding: 22px 28px 26px; image-rendering: pixelated; }
  h1 { margin: 0 0 16px; font-size: 40px; letter-spacing: 2px; text-align: center; color: #f2c75c; text-shadow: 3px 3px 0 #1f150c; }
  .place { display: grid; grid-template-columns: 90px 1fr; gap: 14px; align-items: center; margin: 10px 0; padding: 12px 16px; background: #5a3f26; border: 4px solid #1f150c; box-shadow: inset 0 0 0 3px #7a5530; }
  .place.first { background: #2f6b3a; box-shadow: inset 0 0 0 3px #52a45f; }
  .no { font-size: 46px; color: #f2c75c; text-align: center; text-shadow: 3px 3px 0 #1f150c; }
  .who { font-size: 40px; line-height: 1.1; text-shadow: 3px 3px 0 #1f150c; word-break: break-word; }
  .prize { font-size: 22px; color: #d9c49a; margin-top: 4px; }
  .spin .who { color: #9bd98a; }
</style>
</head>
<body>
<div id="board"><div class="frame"><h1 id="title">Ziehung</h1><div id="list"></div></div></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const GLYPHS = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&?';
let started = null, settled = new Set(), seenAt = new Map();
const scramble = (n) => Array.from({ length: Math.max(4, Math.min(14, n)) }, () => GLYPHS[Math.floor(Math.random() * GLYPHS.length)]).join('');

async function tick() {
  try {
    const v = await (await fetch('/gewinn/api/overlay', { cache: 'no-store' })).json();
    if (!v.active) { $('board').classList.remove('on'); started = null; settled.clear(); seenAt.clear(); return; }
    if (started !== v.startedAt) { started = v.startedAt; settled.clear(); seenAt.clear(); $('list').innerHTML = ''; }
    $('title').textContent = v.title;
    $('board').classList.add('on');
    for (const w of v.winners) if (!seenAt.has(w.place)) seenAt.set(w.place, Date.now());
    $('list').innerHTML = [...v.winners].sort((a, b) => a.place - b.place).map((w) => {
      const spinning = Date.now() - seenAt.get(w.place) < Math.min(2500, v.revealMs * 0.6) && !settled.has(w.place);
      if (!spinning) settled.add(w.place);
      return `<div class="place ${w.place === 1 ? 'first' : ''} ${spinning ? 'spin' : ''}"><div class="no">${w.place}.</div><div><div class="who">${esc(spinning ? scramble(w.name.length) : w.name)}</div><div class="prize">${esc(w.prize)}</div></div></div>`;
    }).join('');
  } catch {}
}
setInterval(tick, 400); tick();
</script>
</body>
</html>
