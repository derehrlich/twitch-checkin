<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stadtwache Chat</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* Waagerechter Chat als OBS-Browserquelle (z. B. 1920×90, Hintergrund bleibt durchsichtig).
     Neue Nachrichten kommen rechts herein, ältere rutschen nach links und verschwinden.
     ?demo  Beispielnachrichten   ?pos=top  Leiste oben   ?scale=1.3  Größe */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: var(--font); }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(64px * var(--s, 1)); display: flex; align-items: center; justify-content: flex-end; gap: calc(14px * var(--s, 1)); padding: 0 calc(16px * var(--s, 1)); overflow: hidden; }
  body.top #bar { bottom: auto; top: 0; }
  .msg { flex: none; display: flex; align-items: center; gap: calc(8px * var(--s, 1)); max-width: 60vw; padding: calc(8px * var(--s, 1)) calc(18px * var(--s, 1)); box-sizing: border-box; border-radius: 999px; background: rgba(20, 10, 4, .72); box-shadow: inset 0 1px 0 rgba(255, 214, 160, .18), 0 2px 8px rgba(0, 0, 0, .35); font-size: calc(26px * var(--s, 1)); font-weight: 500; line-height: 1.2; color: #fff3da; white-space: nowrap; animation: in .45s cubic-bezier(.2, .9, .3, 1); transition: opacity .6s; }
  .msg.out { opacity: 0; }
  .msg b { font-weight: 700; text-shadow: 1px 1px 0 rgba(43, 24, 12, .75); }
  .msg .t { overflow: hidden; text-overflow: ellipsis; }
  .msg img { height: 1.25em; width: auto; vertical-align: middle; }
  @keyframes in { from { opacity: 0; transform: translateX(60px) scale(.9); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="bar" aria-live="off"></div>
<script>
const params = new URLSearchParams(location.search);
if (params.get('pos') === 'top') document.body.classList.add('top');
const scale = Number(params.get('scale'));
if (scale > 0.3 && scale < 5) document.documentElement.style.setProperty('--s', scale);
const bar = document.getElementById('bar');
const SHOWN = new Map(); // Nachrichten-ID -> Element (bleibt klein: wird beim Entfernen mit aufgeräumt)
const COLORS = ['#ff8fc0', '#27c9c0', '#ffd93d', '#a14ee8', '#7fc4ff', '#ff8a1f', '#8be26a', '#ff6b6b'];
const colorOf = (m) => m.c || COLORS[[...m.n].reduce((s, ch) => s + ch.charCodeAt(0), 0) % COLORS.length];
let seconds = 60;

function build(m) {
  const el = document.createElement('div');
  el.className = 'msg';
  const name = document.createElement('b');
  name.textContent = m.n;
  name.style.color = colorOf(m);
  const text = document.createElement('span');
  text.className = 't';
  for (const p of m.m) {
    if (p.e) {
      const img = document.createElement('img');
      img.alt = '';
      img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(p.e)}/default/dark/2.0`;
      text.append(img);
    } else text.append(document.createTextNode(p.x));
  }
  el.append(name, text);
  el.dataset.t = m.t;
  return el;
}

function drop(id) {
  const el = SHOWN.get(id);
  SHOWN.delete(id);
  if (!el) return;
  el.classList.add('out');
  setTimeout(() => el.remove(), 700);
}

function render(d) {
  seconds = d.seconds || 60;
  const ids = new Set(d.messages.map((m) => m.id));
  for (const m of d.messages) if (!SHOWN.has(m.id)) { const el = build(m); SHOWN.set(m.id, el); bar.append(el); }
  for (const id of [...SHOWN.keys()]) if (!ids.has(id)) drop(id); // abgelaufen oder aus der Liste gefallen
  // Was links über den Rand hinausragt, fliegt raus (so wächst nichts an)
  for (const [id, el] of SHOWN) if (el.offsetLeft + el.offsetWidth < 0 || el.offsetLeft < -el.offsetWidth / 2) drop(id);
}

const DEMO = [
  ['Anna', '#ff8fc0', 'Guten Abend zusammen!'], ['Ben', '#27c9c0', 'Das Alpaka-Overlay ist so süß 🦙'],
  ['Cleo', '', 'Wie lang geht der Stream heute?'], ['Dennis', '#a14ee8', 'GG, das war knapp'], ['Fiona', '#e03a3a', 'Hallo aus Hamburg!'],
];
let demoN = 0;
function demo() {
  const [n, c, text] = DEMO[demoN % DEMO.length];
  const m = { id: 'd' + demoN++, t: Date.now(), n, c, m: [{ x: text }] };
  const el = build(m); el._m = m; SHOWN.set(m.id, el); bar.append(el);
  for (const id of [...SHOWN.keys()]) if (SHOWN.size > 5) drop(id);
}

async function poll() {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000); // hängende Anfrage nicht ewig offen lassen
  try {
    const res = await fetch('/api/chatlog', { cache: 'no-store', signal: ctl.signal });
    if (res.ok) render(await res.json());
  } catch { /* beim nächsten Mal wieder */ }
  finally { clearTimeout(timer); }
}

if (params.has('demo')) { demo(); setInterval(demo, 2500); }
else {
  poll();
  setInterval(poll, 2000);
  // Sicherheitsnetz für lange Streams: alle 6 Stunden sauber neu laden (die Leiste füllt sich danach sofort wieder)
  setTimeout(() => location.reload(), 6 * 3600 * 1000);
}
</script>
</body>
</html>
