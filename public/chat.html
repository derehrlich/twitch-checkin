<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stadtwache Chat</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* Waagerechter Chat als OBS-Browserquelle (z. B. 1920×120, Hintergrund durchsichtig).
     Neueste Nachricht links, ältere rutschen nach rechts.   ?demo  Beispielnachrichten   ?scale=1.3  Größe */
  :root { --s: 1; --alpaka: calc(50px * var(--s)); --name: calc(1.25rem * var(--s)); --text: calc(1.15rem * var(--s)); --width: 28ch; --gap: calc(40px * var(--s)); --fade: 8%; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: var(--font); }
  #chat { display: flex; flex-direction: row; align-items: center; justify-content: flex-start; height: 100vh; padding: 0 40px; box-sizing: border-box; gap: var(--gap);
    -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent); mask-image: linear-gradient(to right, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent); }
  .bubble { display: flex; align-items: center; gap: 12px; flex-shrink: 0; animation: in .6s cubic-bezier(.23, 1, .32, 1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateX(-100px); } to { opacity: 1; transform: none; } }
  .alpaka { width: var(--alpaka); height: var(--alpaka); object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .3)); }
  .wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .name { font-weight: 700; font-size: var(--name); white-space: nowrap; text-shadow: 0 2px 4px rgba(0, 0, 0, .8); }
  .text { color: #fff; font-weight: 500; font-size: var(--text); text-shadow: 0 2px 4px rgba(0, 0, 0, .8); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: var(--width); white-space: normal; overflow-wrap: anywhere; }
  .text img { height: 1.3em; width: auto; vertical-align: middle; }
  /* Extras (nur Abos und VIPs): Verlauf, und Glitzer als Lichtschein. Der Schein läuft nur bei den jeweils sichtbaren Nachrichten. */
  .fx-gradient .name, .fx-gradient .text, .fx-glitter .name, .fx-glitter .text { -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .8)); }
  .fx-gradient .name, .fx-gradient .text { background-image: var(--grad); }
  .fx-glitter .name, .fx-glitter .text { background-image: linear-gradient(100deg, var(--c1) 0%, var(--c1) 35%, #fff 48%, #fff 52%, var(--c1) 65%, var(--c1) 100%); background-size: 250% 100%; animation: sweep 2.4s linear infinite; }
  .fx-gradient.fx-glitter .name, .fx-gradient.fx-glitter .text { background-image: var(--gradglit); }
  @keyframes sweep { from { background-position: 150% 0; } to { background-position: -50% 0; } }
</style>
</head>
<body>
<div id="chat" aria-live="off"></div>
<script>
const params = new URLSearchParams(location.search);
const scale = Number(params.get('scale'));
if (scale > 0.3 && scale < 5) document.documentElement.style.setProperty('--s', scale);
const chat = document.getElementById('chat');

// Deine Alpaka-Bilder, je Nachricht eins (nach der Nachrichten-Kennung, so bleibt es nach einem Neuladen gleich)
const ALPAKAS = [
  'https://user-assets.meldstudio.co/99e838bc23a44b1c9f392c53f2d7a95c/ua/ast_mhyq6kt35g912r7w',
  'https://user-assets.meldstudio.co/99e838bc23a44b1c9f392c53f2d7a95c/ua/ast_y4kngmsfnywe8vt7',
  'https://user-assets.meldstudio.co/99e838bc23a44b1c9f392c53f2d7a95c/ua/ast_flchcoran15t0ic1',
  'https://user-assets.meldstudio.co/99e838bc23a44b1c9f392c53f2d7a95c/ua/ast_atpytgfw5o4colo8',
  'https://user-assets.meldstudio.co/99e838bc23a44b1c9f392c53f2d7a95c/ua/ast_i9vmvbmpumttu97g',
  'https://user-assets.meldstudio.co/99e838bc23a44b1c9f392c53f2d7a95c/ua/ast_67opte92pph2vvdf',
];
const hash = (str) => [...str].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const x = (v) => Math.round(255 * v).toString(16).padStart(2, '0');
  return '#' + x(f(0)) + x(f(8)) + x(f(4));
}
function shiftHex(hex, deg) { // weitere Farben für Verlauf und Glitzer: Farbton gedreht
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    h = max === r ? ((g - b) / d + (g < b ? 6 : 0)) / 6 : max === g ? ((b - r) / d + 2) / 6 : ((r - g) / d + 4) / 6;
  }
  // Mindestens kräftige Farbe, sonst sieht man bei Grau, Weiß oder Schwarz keinen Verlauf
  return hslToHex((h * 360 + deg + 360) % 360, Math.max(s, 0.75) * 100, Math.min(0.72, Math.max(0.5, l)) * 100);
}

const SHOWN = new Map(); // Nachrichten-Kennung -> Element
let limit = 10;

function build(m) {
  const base = m.c || hslToHex(hash(m.n.toLowerCase()) % 360, 100, 75); // ohne eigene Farbe: pro Person immer dieselbe
  const el = document.createElement('div');
  el.className = 'bubble' + (m.g ? ' fx-gradient' : '') + (m.s ? ' fx-glitter' : '');
  el.style.setProperty('--c1', base);
  // Verlauffarben: eigene (2 oder 3) oder automatisch aus der Namensfarbe (Farbton +70° und +140°)
  const own = (m.gc ?? []).filter((c) => /^#[0-9a-f]{6}$/i.test(c));
  const cols = own.length >= 2 ? own : [own[0] ?? base, shiftHex(own[0] ?? base, 70), shiftHex(own[0] ?? base, 140)];
  const mid = cols.length > 2 ? `${cols[1]} 24%, ` : '', midEnd = cols.length > 2 ? `, ${cols[1]} 76%` : '';
  el.style.setProperty('--grad', `linear-gradient(90deg, ${cols.join(', ')})`);
  el.style.setProperty('--gradglit', `linear-gradient(100deg, ${cols[0]} 0%, ${mid}#fff 48%, #fff 52%${midEnd}, ${cols.at(-1)} 100%)`);
  el.style.setProperty('--c2', cols[1] ?? base);
  const img = document.createElement('img');
  img.className = 'alpaka'; img.alt = ''; img.src = ALPAKAS[hash(String(m.id)) % ALPAKAS.length];
  const wrap = document.createElement('div'); wrap.className = 'wrap';
  const name = document.createElement('span'); name.className = 'name'; name.textContent = m.n + ':';
  if (!m.g && !m.s) name.style.color = base;
  const text = document.createElement('span'); text.className = 'text';
  for (const p of m.m) {
    if (p.e) { const e = document.createElement('img'); e.alt = ''; e.src = `https://static-cdn.jtvnw.net/emoticons/v2/${encodeURIComponent(p.e)}/default/dark/2.0`; text.append(e); }
    else text.append(document.createTextNode(p.x));
  }
  wrap.append(name, text); el.append(img, wrap);
  return el;
}

function add(m) { const el = build(m); SHOWN.set(m.id, el); chat.prepend(el); }
function drop(id) { SHOWN.get(id)?.remove(); SHOWN.delete(id); }
function trim() { // älteste (ganz rechts) entfernen, so wächst nichts an
  while (chat.children.length > limit) { for (const [id, el] of SHOWN) if (el === chat.lastElementChild) { drop(id); break; } }
}

function render(d) {
  const ids = new Set(d.messages.map((m) => m.id));
  for (const m of d.messages) if (!SHOWN.has(m.id)) add(m); // Reihenfolge alt → neu, jede kommt links davor
  for (const id of [...SHOWN.keys()]) if (!ids.has(id)) drop(id); // abgelaufen oder herausgefallen
  trim();
}

const DEMO = [
  ['Anna', '#ff8fc0', 'Guten Abend zusammen!'], ['Ben', '', 'Das Alpaka-Overlay ist so süß 🦙'],
  ['Cleo', '', 'Wie lang geht der Stream heute?'], ['Dennis', '#a14ee8', 'GG, das war knapp', 1, 1], ['Fiona', '', 'Hallo aus Hamburg!'],
];
let demoN = 0;
function demo() {
  const [n, c, text, g, s] = DEMO[demoN % DEMO.length];
  add({ id: 'demo' + demoN++, t: Date.now(), n, c, g: Boolean(g), s: Boolean(s), m: [{ x: text }] });
  trim();
}

async function poll() {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000); // hängende Anfrage nicht ewig offen lassen
  try {
    const res = await fetch('/api/chatlog', { cache: 'no-store', signal: ctl.signal });
    if (res.ok) { const d = await res.json(); limit = d.max || limit; render(d); }
  } catch { /* beim nächsten Mal wieder */ }
  finally { clearTimeout(timer); }
}

if (params.has('demo')) { demo(); setInterval(demo, 2500); }
else {
  poll(); setInterval(poll, 2000);
  setTimeout(() => location.reload(), 6 * 3600 * 1000); // Sicherheitsnetz für lange Streams: alle 6 Stunden sauber neu laden
}
</script>
</body>
</html>
