<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Check-in Overlay</title>
<link rel="stylesheet" href="/theme.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: var(--pixel-font); }
  canvas { position: fixed; inset: 0; pointer-events: none; image-rendering: pixelated; }
  #stage { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); }

  .card {
    position: relative; width: 600px; padding: 16px 16px 18px; box-sizing: border-box;
    border: 5px solid var(--ink); box-shadow: 0 8px 0 0 var(--ink);
    animation: drop 5s linear forwards;
  }
  .card .lantern { position: absolute; top: 4px; zoom: 1.5; z-index: 2; }
  .card .lantern.l { left: -12px; } .card .lantern.r { right: -12px; animation-delay: -1.6s; }

  .plaque { padding: 20px 24px 22px; text-align: center; }
  .plaque .tag { font-size: 20px; letter-spacing: 3px; text-transform: uppercase; color: var(--ink-soft); }
  .plaque .name { font-size: 48px; font-weight: 700; line-height: 1.1; margin: 4px 0 2px; color: var(--ink); overflow-wrap: anywhere; text-shadow: 0 3px 0 rgba(255,255,255,.25); }
  .plaque .sub { font-size: 24px; color: var(--ink); }

  .badge {
    margin: 14px auto 0; width: max-content; max-width: 100%; padding: 6px 22px 8px;
    background: var(--yellow); color: var(--ink); border: 4px solid var(--ink); box-shadow: 0 4px 0 0 var(--ink);
    font-size: 26px; font-weight: 700; display: flex; gap: 12px; align-items: baseline; animation: pulse .9s steps(2, end) 3;
  }
  .badge b { font-size: 40px; }

  /* Maskottchen (optional): Datei public/img/lama.png ablegen, sonst bleibt der Platz leer */
  .mascot { position: absolute; left: -64px; bottom: -22px; width: 120px; image-rendering: pixelated; }

  @keyframes drop {
    0%   { transform: translateY(-340px); animation-timing-function: steps(9, end); }
    11%  { transform: translateY(0); animation-timing-function: steps(3, end); }
    14%  { transform: translateY(-18px); animation-timing-function: steps(3, end); }
    17%  { transform: translateY(0); }
    88%  { transform: translateY(0); opacity: 1; animation-timing-function: steps(6, end); }
    100% { transform: translateY(-120px); opacity: 0; }
  }
  @keyframes pulse { 50% { transform: scale(1.08); } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="stage"></div>
<script>
// Lautstärke und Dauer kommen aus dem Admin-Bereich. Optional überschreibbar per URL:
// ?volume=0.6 (0..1)   ?duration=5000 (ms)   ?poll=3000 (Abfrageintervall in ms)
// ?demo  zeigt alle paar Sekunden eine Beispielkarte (zum Anpassen des Looks)
const params = new URLSearchParams(location.search);
let volume = Number(params.get('volume') ?? 0.6);
let duration = Number(params.get('duration') ?? 5000);
const pollMs = Math.max(1000, Number(params.get('poll') ?? 3000));

// ---------- Ton ----------
let audioCtx;
let customSound = null;
fetch('/checkin.mp3', { method: 'HEAD' }).then((r) => {
  if (r.ok) { customSound = new Audio('/checkin.mp3'); customSound.volume = volume; }
}).catch(() => {});

function playSound() {
  if (customSound) { customSound.currentTime = 0; customSound.play().catch(() => {}); return; }
  // Fallback: kleine 8-Bit-Fanfare (C-Dur-Akkord aufwärts)
  audioCtx ??= new AudioContext();
  audioCtx.resume();
  const t0 = audioCtx.currentTime;
  [[523.25, 0], [659.25, 0.09], [783.99, 0.18], [1046.5, 0.27], [1046.5, 0.42]].forEach(([freq, at], i, all) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const len = i === all.length - 1 ? 0.45 : 0.12;
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume * 0.22, t0 + at);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + at + len);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0 + at);
    osc.stop(t0 + at + len + 0.02);
  });
}

// ---------- Pixel-Konfetti ----------
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

function burst() {
  const colors = ['#f6b82e', '#f08a24', '#3aa7b5', '#f7e8cc', '#d9a066', '#ffffff'];
  const cx = canvas.width / 2, cy = 70 + 130;
  const wasEmpty = particles.length === 0;
  for (let i = 0; i < 120; i++) {
    const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 11;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, size: 6 + Math.floor(Math.random() * 3) * 4,
      color: colors[i % colors.length], life: 1 });
  }
  if (wasEmpty) requestAnimationFrame(tick);
}
function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter((p) => p.life > 0 && p.y < canvas.height + 40);
  for (const p of particles) {
    p.vy += 0.3; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.life -= 0.006;
    ctx.globalAlpha = p.life > 0.25 ? 1 : p.life * 4; // gestuftes Ausblenden passt zum Pixel-Look
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, p.size, p.size);
    ctx.fillStyle = 'rgba(58,33,18,.55)'; // dunkle Unterkante wie ein Pixel-Schatten
    ctx.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4 + p.size, p.size, 2);
  }
  ctx.globalAlpha = 1;
  if (particles.length) requestAnimationFrame(tick);
}

// ---------- Warteschlange, damit mehrere Check-ins nacheinander laufen ----------
const stage = document.getElementById('stage');
const queue = [];
let busy = false;

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const nameSize = (n) => (n.length > 22 ? 28 : n.length > 16 ? 36 : n.length > 12 ? 42 : 48);

async function next() {
  if (busy || !queue.length) return;
  busy = true;
  const ev = queue.shift();
  stage.innerHTML = `<div class="card wood" style="animation-duration:${duration}ms">
      <div class="lantern l"><i></i></div><div class="lantern r"><i></i></div>
      <div class="plaque">
        <div class="tag">Eingecheckt</div>
        <div class="name" style="font-size:${nameSize(ev.user)}px">${esc(ev.user)}</div>
        <div class="sub">schön, dass du da bist!</div>
        <i class="nail-b"></i>
      </div>
      <div class="badge"><span>Besuch</span><b>#${esc(ev.count)}</b></div>
      <img class="mascot" src="/img/lama.png" alt="" onerror="this.remove()">
    </div>`;
  playSound();
  setTimeout(burst, duration * 0.1); // Konfetti, wenn die Karte aufsetzt
  await new Promise((r) => setTimeout(r, duration + 300));
  stage.innerHTML = '';
  busy = false;
  next();
}

// ---------- Server fragen, ob neue Check-ins da sind ----------
// Netlify kann keine dauerhaften Verbindungen halten, daher wird regelmäßig nachgefragt.
let cursor = null;
async function poll() {
  try {
    const res = await fetch('/api/overlay' + (cursor ? '?since=' + encodeURIComponent(cursor) : ''), { cache: 'no-store' });
    const data = await res.json();
    cursor = data.cursor;
    if (data.volume != null && !params.has('volume')) volume = data.volume;
    if (data.duration != null && !params.has('duration')) duration = data.duration;
    if (customSound) customSound.volume = volume;
    for (const ev of data.events) if (ev.type === 'checkin') queue.push(ev);
    next();
  } catch { /* Netzwerkfehler: beim nächsten Durchlauf erneut */ }
  setTimeout(poll, pollMs);
}

if (params.has('demo')) {
  const names = ['Akinasuka', 'NovelsByEverly', 'Max', 'EinSehrLangerZuschauerName123'];
  let i = 0;
  const show = () => { queue.push({ type: 'checkin', user: names[i % names.length], count: 7 + i * 13 }); i++; next(); };
  show(); setInterval(show, duration + 1500);
} else {
  poll();
}
</script>
</body>
</html>
