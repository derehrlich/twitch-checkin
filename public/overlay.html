<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Stadtwache Overlay</title>
<link rel="stylesheet" href="/theme.css">
<script src="/chime.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: var(--font); }
  canvas { position: fixed; inset: 0; pointer-events: none; }
  #stage { position: fixed; left: 50%; top: 190px; transform: translateX(-50%); }

  .wrap { position: relative; animation: drop 5s linear forwards; }
  .card { position: relative; min-width: 600px; max-width: 820px; padding: 24px 34px 26px; box-sizing: border-box; }
  .wrap .lantern { position: absolute; top: -78px; z-index: 3; }
  .wrap .lantern.l { left: -14px; } .wrap .lantern.r { right: -14px; animation-delay: -1.8s; }

  .row { display: flex; align-items: center; gap: 26px; }
  .coin {
    width: 104px; height: 104px; border-radius: 50%; flex: none; display: grid; place-content: center; text-align: center; line-height: 1;
    background: radial-gradient(circle at 34% 27%, #fff4b8 0, #f6c850 30%, #cf9020 68%, #8f5e16 100%);
    border: 3px solid #5a3a10; color: #4a2c0a;
    box-shadow: inset 0 0 0 3px rgba(255, 244, 190, .55), inset 0 -8px 12px rgba(110, 64, 10, .45), 0 5px 10px rgba(10, 5, 2, .55);
  }
  .coin small { font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 600; opacity: .85; }
  .coin b { display: block; font-weight: 700; margin-top: 2px; text-shadow: 0 1px 0 rgba(255, 244, 190, .75); }

  .txt { min-width: 0; }
  .tag { display: flex; align-items: center; gap: 8px; font-size: 15px; letter-spacing: 2.4px; text-transform: uppercase; font-weight: 600; color: #e9d3ae; }
  .tag i.out { background: #f0a83a; box-shadow: 0 0 8px 1px rgba(240, 168, 58, .85); }
  .tag i { width: 10px; height: 10px; border-radius: 50%; background: #62c254; box-shadow: 0 0 8px 1px rgba(98, 194, 84, .8); }
  .name { font-weight: 700; line-height: 1.08; color: #fff3da; overflow-wrap: anywhere; margin: 4px 0 2px; text-shadow: 0 3px 0 rgba(43, 24, 12, .75), 0 6px 10px rgba(0, 0, 0, .35); }
  .sub { font-size: 22px; font-weight: 500; color: #ecd9b6; }

  .bar { margin-top: 20px; height: 9px; border-radius: 6px; background: rgba(20, 10, 4, .55); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .6), 0 1px 0 rgba(255, 214, 160, .18); overflow: hidden; }
  .bar span { display: block; height: 100%; border-radius: 6px; background: linear-gradient(to right, #f0a83a, #ea5a30); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); transform-origin: left; animation: timer 5s linear forwards; }

  /* Maskottchen: sitzt auf dem Schild, die untere Kante verschwindet hinter der Karte (Datei: public/img/lama.png) */
  .mascot { position: absolute; left: 96px; bottom: calc(100% - 30px); width: 118px; filter: drop-shadow(0 4px 4px rgba(10, 5, 2, .5)); }

  /* Raid: Karte oben, darunter der Clip des Raiders im selben Rahmen */
  .tag i.raid { background: #b98cff; box-shadow: 0 0 8px 1px rgba(185, 140, 255, .85); }
  .tag i.gold { background: #ffd45e; box-shadow: 0 0 10px 2px rgba(255, 212, 94, .9); }
  .wrap.milestone .card { box-shadow: 0 0 0 3px rgba(255, 212, 94, .7), 0 0 38px 8px rgba(255, 190, 70, .55); }
  .coin.raid b { font-size: 40px; }
  #clip { position: fixed; left: 50%; top: 580px; width: 720px; transform: translateX(-50%); padding: 14px; box-sizing: border-box; animation: clipin .6s cubic-bezier(.2, .9, .3, 1) both; }
  #clip.out { animation: clipout .5s ease-in forwards; }
  #clip .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; overflow: hidden; }
  #clip iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #clip .cap { margin-top: 8px; font-size: 18px; font-weight: 600; color: #ecd9b6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes clipin { from { opacity: 0; transform: translate(-50%, 40px) scale(.94); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  @keyframes clipout { to { opacity: 0; transform: translate(-50%, 30px) scale(.96); } }

  /* Schild-Layout für Alerts und Raids (wie im alten Meld-Alert): Titel, Name, Nachricht, darüber ein großes Bild/GIF */
  :root { --wood-img: linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px), repeating-linear-gradient(0deg, transparent 0, transparent 8px, rgba(0, 0, 0, .1) 8px, rgba(0, 0, 0, .1) 10px); }
  /* Soundboard: kleines Holz-Schild unten links, solange ein Kanalpunkte-Sound läuft */
  #sbtoast { position: fixed; left: 40px; bottom: 40px; display: flex; align-items: center; gap: 14px; padding: 12px 22px 12px 16px; max-width: 520px; box-sizing: border-box;
    background-color: #724C31; background-image: var(--wood-img); border: 4px solid #4A2F1B; border-radius: 12px; box-shadow: 0 4px 0 0 #4A2F1B, 0 8px 18px rgba(0, 0, 0, .5);
    color: #fff3da; opacity: 0; transform: translateY(24px) scale(.96); transition: opacity .35s, transform .45s cubic-bezier(.34, 1.56, .64, 1); pointer-events: none; }
  #sbtoast.show { opacity: 1; transform: none; }
  #sbtoast i { font-style: normal; font-size: 30px; }
  #sbtoast span { display: flex; flex-direction: column; min-width: 0; }
  #sbtoast b { font-size: 22px; text-shadow: 2px 2px 0 rgba(0, 0, 0, .5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sbtoast small { font-size: 17px; color: #ecd9b6; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sign .card { min-width: 440px; max-width: 620px; text-align: center; padding: 30px 44px 26px; }
  /* Holz-Hintergrund wie in der Ziel-Badge: Raster und Streifen, dunkler Rand, Schrauben, wanderndes Glanz-Licht, goldener Glow beim Aufsetzen */
  .wrap .card.panel {
    background-color: #724C31;
    background-image: var(--wood-img);
    background-size: auto;
    border: 6px solid #4A2F1B; border-radius: 15px;
    box-shadow: 0 6px 0 0 #4A2F1B, 0 12px 24px rgba(0, 0, 0, .5);
    overflow: hidden;
  }
  .wrap .card > * { position: relative; z-index: 2; }
  .wrap .card::before { /* Glanz-Lichtspiel */
    content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(105deg, transparent 20%, rgba(255, 255, 255, .08) 45%, rgba(255, 255, 255, .15) 50%, rgba(255, 255, 255, .05) 55%, transparent 75%);
    background-size: 250% 100%; animation: sheen 7s ease-in-out infinite;
  }
  .wrap .card::after { /* vier Schrauben in den Ecken */
    content: ''; position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background:
      radial-gradient(circle at 14px 14px, #a8a8a8 0 3px, #555 3.5px 5px, transparent 5.5px),
      radial-gradient(circle at calc(100% - 14px) 14px, #a8a8a8 0 3px, #555 3.5px 5px, transparent 5.5px),
      radial-gradient(circle at 14px calc(100% - 14px), #a8a8a8 0 3px, #555 3.5px 5px, transparent 5.5px),
      radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), #a8a8a8 0 3px, #555 3.5px 5px, transparent 5.5px);
  }
  .wrap.milestone .card.panel { box-shadow: 0 0 0 3px rgba(255, 212, 94, .7), 0 0 38px 8px rgba(255, 190, 70, .55), 0 6px 0 0 #4A2F1B, 0 12px 24px rgba(0, 0, 0, .5); }
  @keyframes sheen { 0% { background-position: 180% 0; } 100% { background-position: -80% 0; } }
  @keyframes woodglow { /* goldener Glow wie beim Aktualisieren der Ziel-Badge */
    0% { box-shadow: 0 0 34px 10px rgba(246, 196, 83, .9), 0 6px 0 0 #4A2F1B, 0 12px 24px rgba(0, 0, 0, .5); }
    100% { box-shadow: 0 0 0 0 rgba(246, 196, 83, 0), 0 6px 0 0 #4A2F1B, 0 12px 24px rgba(0, 0, 0, .5); }
  }
  .sign.gif .card { padding-top: 138px; }
  .gifbox { position: absolute; left: 50%; top: -190px; transform: translateX(-50%); width: 320px; height: 320px; z-index: 4; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 15px 20px rgba(0, 0, 0, .6)); pointer-events: none; }
  .gifbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .title { font-size: 22px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: rgba(254, 215, 170, .92); text-shadow: 2px 2px 0 rgba(0, 0, 0, .5); }
  .sign .name { text-align: center; margin: 6px 0 4px; }
  .msg { font-size: 23px; font-style: italic; font-weight: 500; color: #ecd9b6; text-shadow: 2px 2px 0 rgba(0, 0, 0, .45); opacity: .92; margin-top: 4px; }
  .extra { font-size: 18px; margin-top: 6px; color: #d9c39b; }

  @keyframes drop {
    0%   { transform: translateY(-320px); opacity: 0; animation-timing-function: cubic-bezier(.2, .9, .3, 1); }
    13%  { transform: translateY(12px); opacity: 1; animation-timing-function: ease-in-out; }
    19%  { transform: translateY(-5px); animation-timing-function: ease-in-out; }
    24%  { transform: translateY(0); }
    90%  { transform: translateY(0); opacity: 1; animation-timing-function: ease-in; }
    100% { transform: translateY(-70px); opacity: 0; }
  }
  @keyframes timer { 0%, 24% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="stage"></div>
<div id="clipstage"></div>
<div id="sbtoast"></div>
<script>
// Lautstärke und Dauer kommen aus dem Admin-Bereich. Optional überschreibbar per URL:
// ?volume=0.6 (0..1)   ?duration=5000 (ms)   ?poll=3000 (Abfrageintervall in ms)
// ?demo  zeigt alle paar Sekunden eine Beispielkarte (zum Anpassen des Looks)
const params = new URLSearchParams(location.search);
let volume = Number(params.get('volume') ?? 0.6);
let duration = Number(params.get('duration') ?? 5000);
let alertDuration = 8000, raidDuration = 11000;
const pollMs = Math.max(1000, Number(params.get('poll') ?? 3000));
// Getrennte Quellen für OBS: /overlay-alerts (Check-in, Raid, Follow, Sub, Bits … mit Eigenton), /overlay-sounds
// (Kanalpunkte-Soundboard) und /overlay-entry (nur die Einlaufsounds). /overlay (oder ?mode=all) macht wie bisher alles.
// Jede Quelle hat in OBS ihren eigenen Regler. Ohne /overlay-entry bleibt ein Check-in mit Einlaufsound in /overlay-alerts stumm.
const mode = ['alerts', 'sounds', 'entry'].find((m) => location.pathname.includes('overlay-' + m)) ?? params.get('mode') ?? 'all';
const wantAlerts = mode === 'all' || mode === 'alerts', wantSounds = mode === 'all' || mode === 'sounds', onlyEntry = mode === 'entry';

// ---------- Ton ----------
// Jeder Alert hat einen Ton-Platz (checkin, raid, follow, ...). Reihenfolge je Platz: im Admin hochgeladener Ton,
// dann der Ersatz-Platz (Check-out und Meilenstein nehmen den Check-in-Ton, Resub den Sub-Ton),
// bei der Check-in-Familie zusätzlich public/checkin.mp3, zuletzt ein eingebauter Klang, der je Platz anders klingt.
const FALLBACK = { checkout: 'checkin', milestone: 'checkin', resub: 'sub' };
let staticSound = null;
const uploaded = {}; // Platz -> { url, audio }
fetch('/checkin.mp3', { method: 'HEAD' }).then((r) => {
  if (r.ok) { staticSound = new Audio('/checkin.mp3'); staticSound.volume = volume; }
}).catch(() => {});

function useUploadedSounds(map) {
  for (const slot of Object.keys(uploaded)) if (!map[slot]) delete uploaded[slot];
  for (const [slot, url] of Object.entries(map)) {
    if (uploaded[slot]?.url === url) continue;
    const audio = new Audio(url);
    audio.preload = 'auto'; audio.volume = volume;
    uploaded[slot] = { url, audio };
  }
}
function setSoundVolume() { for (const a of [staticSound, ...Object.values(uploaded).map((u) => u.audio)]) if (a) a.volume = volume; }

// Platz eines Ereignisses
function slotFor(ev) {
  if (ev.type === 'alert') return ev.kind;
  if (ev.type === 'raid') return 'raid';
  if (ev.type === 'checkout') return 'checkout';
  return ev.milestone ? 'milestone' : 'checkin';
}

// Persönlicher Einlaufsound einer Person (kommt mit dem Check-in-Ereignis). Er wird nach max Sekunden abgeschnitten,
// damit auch zu lange Dateien den Stream nicht aufhalten.
const personal = {}; // Adresse -> Audio
function personalPick(entry) {
  if (!personal[entry.url]) { const a = new Audio(entry.url); a.preload = 'auto'; personal[entry.url] = a; }
  const audio = personal[entry.url];
  audio.volume = volume;
  return { slot: 'checkin', audio, maxMs: Math.max(1, Number(entry.max) || 5) * 1000 };
}

// Wählt den Ton für einen Platz: { audio } bei einer Datei, sonst { slot } für den eingebauten Klang
function pickSound(slot = 'checkin') {
  let file = null, inCheckinFamily = false;
  for (let s = slot; s; s = FALLBACK[s]) {
    if (uploaded[s]) { file = uploaded[s].audio; break; }
    if (s === 'checkin') inCheckinFamily = true;
  }
  file ??= inCheckinFamily ? staticSound : null;
  return { slot, audio: file };
}
// Länge einer Sounddatei in ms (höchstens 30 s): das Schild bleibt so lange stehen, der Ton wird nie abgeschnitten
const soundMs = (pick) => (pick.audio && Number.isFinite(pick.audio.duration) ? Math.min(pick.maxMs ?? 30_000, Math.ceil(pick.audio.duration * 1000) + 200) : 0);
let currentAudio = null;
function startSound(pick) {
  if (pick.silent) return;
  if (currentAudio) { try { currentAudio.pause(); currentAudio.currentTime = 0; } catch { /* egal */ } currentAudio = null; } // nichts überlappt
  if (!pick.audio) return playChime(volume, pick.slot);
  currentAudio = pick.audio;
  pick.audio.currentTime = 0;
  pick.audio.play().catch(() => playChime(volume, pick.slot));
  if (pick.maxMs) { const a = pick.audio; setTimeout(() => { if (currentAudio === a) { try { a.pause(); } catch { /* egal */ } } }, pick.maxMs); }
}

// ---------- Bilder/GIFs über den Schildern (Platz wie beim Ton; Resub nimmt ohne eigenes Bild das Sub-Bild) ----------
let images = {};
const IMAGE_FALLBACK = { resub: 'sub' };
function useImages(map) {
  for (const [slot, url] of Object.entries(map)) if (images[slot] !== url) new Image().src = url; // vorladen
  images = map;
}
const imageFor = (slot) => images[slot] ?? images[IMAGE_FALLBACK[slot]] ?? null;

// ---------- Funken (warm, weich) ----------
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

function star(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = rot + (i * Math.PI) / 4, rad = i % 2 ? r * 0.28 : r;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}

function burst(n = 80) {
  const colors = ['#ffd45e', '#ffb347', '#fff1b8', '#ffe08a', '#ff9f4a', '#fffaf0'];
  const card = document.querySelector('.card');
  const rect = card ? card.getBoundingClientRect() : { left: innerWidth / 2 - 300, width: 600, top: 110, height: 150 };
  const wasEmpty = particles.length === 0;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 7;
    particles.push({
      x: rect.left + rect.width * (0.15 + Math.random() * 0.7), y: rect.top + rect.height * 0.5,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, r: 3 + Math.random() * 7, rot: Math.random() * 6,
      spin: (Math.random() - 0.5) * 0.12, star: Math.random() < 0.6, color: colors[i % colors.length], life: 1, fade: 0.006 + Math.random() * 0.006,
    });
  }
  if (wasEmpty) requestAnimationFrame(tick);
}
function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter((p) => p.life > 0 && p.y < canvas.height + 40);
  for (const p of particles) {
    p.vy += 0.12; p.vx *= 0.985; p.vy *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.spin; p.life -= p.fade;
    const twinkle = 0.75 + 0.25 * Math.sin(p.life * 40 + p.rot);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6)) * twinkle;
    ctx.shadowColor = p.color; ctx.shadowBlur = 10;
    ctx.fillStyle = p.color;
    if (p.star) { star(p.x, p.y, p.r, p.rot); ctx.fill(); } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.45, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  if (particles.length) requestAnimationFrame(tick);
}

// ---------- Warteschlange, damit mehrere Ereignisse nacheinander laufen ----------
const stage = document.getElementById('stage');
const queue = [];
let busy = false;

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const nameSize = (n) => (n.length > 22 ? 30 : n.length > 16 ? 38 : n.length > 12 ? 46 : 54);
const coinSize = (c) => (String(c).length > 3 ? 28 : String(c).length > 2 ? 34 : 44);
// Check-out: Münze zeigt die Dauer, z. B. "45" Minuten oder "2:14" Stunden
function coinFor(ev) {
  if (ev.type !== 'checkout') return { small: 'Besuch', big: ev.count };
  const m = Math.max(0, Number(ev.minutes) || 0);
  return m < 60 ? { small: 'Minuten', big: m } : { small: 'Stunden', big: `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}` };
}

// Reihenfolge, wenn mehrere warten: Raid vor Sub vor Cheer vor Follow, dann Meilenstein, Check-in/-out zuletzt
const PRIORITY = { raid: 1, sub: 2, resub: 2, gift: 2, cheer: 3, rescue: 3, follow: 4, milestone: 5, checkin: 6, checkout: 6 };
function enqueue(ev) {
  const p = PRIORITY[slotFor(ev)] ?? 9;
  const i = queue.findIndex((q) => (PRIORITY[slotFor(q)] ?? 9) > p); // hinter alle mit gleicher oder besserer Priorität
  if (i < 0) queue.push(ev); else queue.splice(i, 0, ev);
}

const clipStage = document.getElementById('clipstage');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// Alert- und Raid-Schild: Bild/GIF darüber, Titel, Name, Nachricht (Texte kommen aus dem Admin). Bei einem Raid folgt ein Clip.
async function showSign(ev) {
  const isRaid = ev.type === 'raid';
  const slot = slotFor(ev);
  const pick = pickSound(slot);
  const cardMs = Math.max(isRaid ? raidDuration : alertDuration, soundMs(pick));
  const img = imageFor(slot);
  const name = String(isRaid ? ev.raider : ev.user);
  const clipMs = isRaid && ev.clip ? (Number(ev.clip.duration) || 15) * 1000 : 0;
  stage.innerHTML = `<div class="wrap sign${img ? ' gif' : ''}" style="animation-duration:${cardMs}ms">
    ${img ? `<div class="gifbox"><img src="${esc(img)}" alt=""></div>` : '<img class="mascot" src="/img/lama.png" alt="" onerror="this.remove()">'}
    <div class="lantern l"><i></i></div><div class="lantern r"><i></i></div>
    <div class="card panel" style="animation: woodglow 1.6s ease-out ${Math.round(cardMs * 0.2)}ms">
      <div class="title">${esc(ev.title ?? '')}</div>
      <div class="name" style="font-size:${Math.round(nameSize(name) * 0.9)}px">${esc(name)}</div>
      ${ev.message ? `<div class="msg">${esc(ev.message)}</div>` : ''}
      ${ev.extra ? `<div class="extra">${esc(ev.extra)}</div>` : ''}
      <div class="bar"><span style="animation-duration:${cardMs}ms"></span></div>
    </div>
  </div>`;
  startSound(pick);
  setTimeout(burst, cardMs * 0.14);
  if (isRaid) [2500, 5000].forEach((t) => setTimeout(burst, t)); // wie beim alten Raid-Alarm: weitere Salven
  const started = Date.now();
  if (clipMs) {
    await sleep(1500);
    const src = `https://clips.twitch.tv/embed?clip=${encodeURIComponent(ev.clip.id)}&parent=${encodeURIComponent(location.hostname)}&autoplay=true&muted=false`;
    clipStage.innerHTML = `<div id="clip" class="panel"><div class="frame"><iframe src="${src}" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      <div class="cap">🎬 ${esc(ev.clip.title || 'Clip')}${ev.clip.creator ? ` · von ${esc(ev.clip.creator)}` : ''}</div></div>`;
    await sleep(clipMs + 1500); // Puffer für den Ladevorgang des Players
    document.getElementById('clip')?.classList.add('out');
    await sleep(500);
    clipStage.innerHTML = '';
  }
  // Schild mindestens so lange stehen lassen, wie seine Animation dauert (auch ohne Clip)
  await sleep(Math.max(0, cardMs - (Date.now() - started)) + 300);
  stage.innerHTML = '';
}

function checkView(ev) {
  const out = ev.type === 'checkout';
  if (ev.milestone) return { small: 'Besuch', big: ev.count, dot: 'gold', tag: 'Meilenstein erreicht', sub: `${ev.count}. Besuch – danke für deine Treue!` };
  if (!out && ev.streak >= 2) return { ...coinFor(ev), dot: '', tag: 'Eingecheckt', sub: `🔥 ${ev.streak} Streams in Folge` };
  const coin = coinFor(ev);
  return { small: coin.small, big: coin.big, dot: out ? 'out' : '', tag: out ? 'Ausgecheckt' : 'Eingecheckt', sub: out ? 'bis zum nächsten Mal!' : 'schön, dass du da bist!' };
}

// Check-in, Check-out und Meilenstein: Karte mit Münze
async function showCard(ev) {
  const v = checkView(ev);
  // Mit Einlaufsound: in /overlay spielt ihn die Karte, in /overlay-alerts bleibt sie stumm (Ton kommt aus /overlay-entry)
  const pick = ev.entrySound ? (mode === 'all' ? personalPick(ev.entrySound) : { slot: 'checkin', audio: null, silent: true }) : pickSound(slotFor(ev));
  const dur = Math.max(ev.milestone ? Math.round(duration * 1.7) : duration, soundMs(pick)); // Meilensteine bleiben länger stehen
  stage.innerHTML = `<div class="wrap${ev.milestone ? ' milestone' : ''}" style="animation-duration:${dur}ms">
    <img class="mascot" src="/img/lama.png" alt="" onerror="this.remove()">
    <div class="lantern l"><i></i></div><div class="lantern r"><i></i></div>
    <div class="card panel" style="animation: woodglow 1.6s ease-out ${Math.round(dur * 0.2)}ms">
      <div class="row">
        <div class="coin"><small>${esc(v.small)}</small><b style="font-size:${coinSize(v.big)}px">${esc(v.big)}</b></div>
        <div class="txt">
          <div class="tag"><i class="${v.dot}"></i>${esc(v.tag)}</div>
          <div class="name" style="font-size:${nameSize(ev.user)}px">${esc(ev.user)}</div>
          <div class="sub">${esc(v.sub)}</div>
        </div>
      </div>
      <div class="bar"><span style="animation-duration:${dur}ms"></span></div>
    </div>
  </div>`;
  startSound(pick);
  if (ev.milestone) { // Sonder-Feuerwerk: drei große Salven
    [0.14, 0.14 + 700 / dur, 0.14 + 1500 / dur].forEach((f) => setTimeout(() => burst(180), dur * f));
  } else setTimeout(burst, dur * 0.14); // Funken, wenn die Karte aufsetzt
  await sleep(dur + 300);
  stage.innerHTML = '';
}

async function next() {
  if (busy || !queue.length) return;
  busy = true;
  const ev = queue.shift();
  try {
    await (ev.type === 'raid' || ev.type === 'alert' ? showSign(ev) : showCard(ev));
  } catch (e) { // ein kaputtes Ereignis darf die Warteschlange nie blockieren
    console.error('Overlay-Fehler:', e);
    stage.innerHTML = ''; clipStage.innerHTML = '';
  }
  await sleep(800); // kurze Ruhe zwischen zwei Ereignissen
  busy = false;
  if (!queue.length) maybeReload();
  next();
}

// ---------- Server fragen, ob neue Check-ins da sind ----------
// Netlify kann keine dauerhaften Verbindungen halten, daher wird regelmäßig nachgefragt.
let cursor = null;
async function poll() {
  try {
    const res = await fetch('/api/overlay' + (cursor ? '?since=' + encodeURIComponent(cursor) : ''), { cache: 'no-store' });
    const data = await res.json();
    cursor = data.cursor;
    if (data.volume != null && !params.has('volume')) volume = data.volume;
    if (data.duration != null && !params.has('duration')) duration = data.duration;
    if (data.alertDuration) alertDuration = data.alertDuration;
    if (data.raidDuration) raidDuration = data.raidDuration;
    useImages(data.images ?? {});
    useUploadedSounds(data.sounds ?? {});
    setSoundVolume();
    for (const ev of data.events) {
      if (onlyEntry) { if (ev.type === 'checkin' && ev.entrySound) { if (entryQueue.length < 5) entryQueue.push(ev.entrySound); runEntry(); } }
      else if (ev.type === 'sound') { if (wantSounds) playBoard(ev); }
      else if (wantAlerts && ['checkin', 'checkout', 'raid', 'alert'].includes(ev.type)) enqueue(ev);
    }
    next();
  } catch { /* Netzwerkfehler: beim nächsten Durchlauf erneut */ }
  setTimeout(poll, pollMs);
}

// ---------- Nur Einlaufsounds (/overlay-entry) ----------
// Spielt die Töne nacheinander ab und schneidet jeden nach der eingestellten Länge ab. Nichts wird angezeigt.
const entryQueue = [];
let entryBusy = false;
async function runEntry() {
  if (entryBusy) return;
  entryBusy = true;
  while (entryQueue.length) {
    const { audio, maxMs } = personalPick(entryQueue.shift());
    audio.currentTime = 0;
    await new Promise((resolve) => {
      const done = () => { try { audio.pause(); } catch { /* egal */ } clearTimeout(t); audio.removeEventListener('ended', done); resolve(); };
      const t = setTimeout(done, maxMs);
      audio.addEventListener('ended', done);
      audio.play().catch(done);
    });
    await sleep(300);
  }
  entryBusy = false;
}

// ---------- Kanalpunkte-Soundboard ----------
// Die Töne werden vorab geladen (Liste vom Server), damit sie bei einer Einlösung ohne Verzögerung spielen.
// Soundboard-Töne laufen sofort und stehen nicht in der Warteschlange der Alerts. Ein Ton endet spätestens nach 20 Sekunden.
const board = {}; // id -> { url, audio }
async function loadBoard() {
  try {
    const map = await (await fetch('/api/soundboard', { cache: 'no-store' })).json();
    for (const id of Object.keys(board)) if (!map[id]) delete board[id];
    for (const [id, url] of Object.entries(map)) {
      if (board[id]?.url === url) continue;
      const audio = new Audio(url); audio.preload = 'auto';
      board[id] = { url, audio };
    }
  } catch { /* beim nächsten Durchlauf erneut */ }
  setTimeout(loadBoard, 60_000);
}
let sbTimer = null;
function playBoard(ev) {
  const a = new Audio(ev.src);
  a.volume = Math.max(0, Math.min(1, volume * (Number(ev.volume) || 1)));
  a.play().catch(() => {});
  const stop = setTimeout(() => { try { a.pause(); } catch { /* egal */ } }, 20_000);
  a.addEventListener('ended', () => clearTimeout(stop), { once: true });
  const el = document.getElementById('sbtoast');
  el.innerHTML = `<i>🔊</i><span><b>${esc(ev.user)}</b><small>${esc(ev.title)}</small></span>`;
  el.classList.add('show');
  clearTimeout(sbTimer);
  sbTimer = setTimeout(() => el.classList.remove('show'), 4500);
}

// ---------- Selbst-Update ----------
// OBS lädt eine Browserquelle nach einem Deploy nicht von selbst neu und zeigt sonst weiter die alte Version.
// Deshalb vergleicht das Overlay alle 2 Minuten die ausgelieferte Seite mit der geladenen und lädt sich neu,
// sobald gerade nichts angezeigt wird. (?updatecheck=<ms> ändert den Abstand, mindestens 5000.)
const updateMs = Math.max(5000, Number(params.get('updatecheck') ?? 120_000));
let loadedSignature = null, stale = false;
const hashText = (t) => { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return `${h}:${t.length}`; };
function maybeReload() { if (stale && !busy && !queue.length) location.reload(); }
async function checkForUpdate() {
  try {
    const res = await fetch('/overlay.html', { cache: 'no-store' });
    if (res.ok) {
      const sig = hashText(await res.text());
      if (loadedSignature === null) loadedSignature = sig; else if (sig !== loadedSignature) stale = true;
    }
  } catch { /* offline: später erneut */ }
  maybeReload();
  setTimeout(checkForUpdate, updateMs);
}

if (params.has('demo')) {
  const names = ['NovelsByEverly', 'Akinasuka', 'Max', 'EinSehrLangerZuschauerName123'];
  const demos = [
    (n) => ({ type: 'checkin', user: names[n], count: [7, 42, 128, 1032][n] }),
    (n) => ({ type: 'alert', kind: 'follow', user: names[n], title: 'Neuer Follower!', message: '' }),
    (n) => ({ type: 'alert', kind: 'sub', user: names[n], title: 'Neues Abo!', message: 'Tier 1 (6 Monate)', extra: 'Immer wieder gerne!' }),
    (n) => ({ type: 'raid', raider: names[n], viewers: [12, 85, 240, 3][n], title: 'Raid-Alarm!', message: `Bringt ${[12, 85, 240, 3][n]} Leute mit!`, extra: 'zuletzt: Just Chatting · 3. Mal bei uns', clip: null }),
    (n) => ({ type: 'checkout', user: names[n], minutes: [134, 45, 7, 610][n], count: 7 }),
    (n) => ({ type: 'alert', kind: 'cheer', user: names[n], title: 'Neuer Cheer!', message: '500 Bits', extra: 'Cheer500 für dich!' }),
    (n) => ({ type: 'alert', kind: 'gift', user: names[n], title: 'Sub-Geschenk!', message: 'verschenkt 5 Sub(s)!' }),
    (n) => ({ type: 'checkin', user: names[n], count: 100, streak: 12, milestone: true }),
  ];
  let i = 0;
  const show = () => { enqueue(demos[i % demos.length](i % names.length)); i++; next(); };
  show(); setInterval(show, duration + 1500);
} else {
  poll();
  if (wantSounds) loadBoard();
  checkForUpdate();
}
</script>
