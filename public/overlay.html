<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Check-in Overlay</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; pointer-events: none; }
  #stage { position: fixed; left: 50%; top: 14%; transform: translateX(-50%); }
  .card {
    min-width: 440px; padding: 22px 40px; border-radius: 22px; text-align: center; color: #fff;
    background: linear-gradient(135deg, #9146ff, #5b2bd1);
    border: 3px solid rgba(255,255,255,.55);
    box-shadow: 0 10px 40px rgba(145,70,255,.6), 0 0 0 6px rgba(145,70,255,.25);
    animation: pop 5s cubic-bezier(.2,1.3,.4,1) forwards;
  }
  .card .icon { font-size: 54px; animation: spin 1s ease-out; display: inline-block; }
  .card .name { font-size: 44px; font-weight: 800; text-shadow: 0 3px 8px rgba(0,0,0,.4); }
  .card .sub { font-size: 26px; font-weight: 600; opacity: .95; }
  .card .sub b { font-size: 34px; color: #ffe066; }
  @keyframes pop {
    0%   { transform: translateY(-160px) scale(.4); opacity: 0; }
    12%  { transform: translateY(0) scale(1.08); opacity: 1; }
    18%  { transform: scale(1); }
    85%  { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-80px) scale(.8); opacity: 0; }
  }
  @keyframes spin { from { transform: rotate(-360deg) scale(0); } to { transform: rotate(0) scale(1); } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="stage"></div>
<script>
// Optionen per URL: ?volume=0.6  (0..1)   ?duration=5000 (ms)
const params = new URLSearchParams(location.search);
const volume = Number(params.get('volume') ?? 0.6);
const duration = Number(params.get('duration') ?? 5000);

// ---------- Ton ----------
let audioCtx;
let customSound = null;
fetch('/checkin.mp3', { method: 'HEAD' }).then((r) => {
  if (r.ok) { customSound = new Audio('/checkin.mp3'); customSound.volume = volume; }
}).catch(() => {});

function playSound() {
  if (customSound) { customSound.currentTime = 0; customSound.play().catch(() => {}); return; }
  // Fallback: kleines "Ding-Ding-Dong" per WebAudio
  audioCtx ??= new AudioContext();
  audioCtx.resume();
  const t0 = audioCtx.currentTime;
  [[660, 0], [880, 0.12], [1320, 0.24]].forEach(([freq, at]) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t0 + at);
    gain.gain.linearRampToValueAtTime(volume * 0.5, t0 + at + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + at + 0.7);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0 + at);
    osc.stop(t0 + at + 0.75);
  });
}

// ---------- Konfetti ----------
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

function burst() {
  const colors = ['#ffe066', '#ff6b9d', '#6bdcff', '#9dff6b', '#ffffff', '#c9a6ff'];
  const cx = canvas.width / 2, cy = canvas.height * 0.22;
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 12;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, w: 6 + Math.random() * 8, h: 4 + Math.random() * 6,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .4, color: colors[i % colors.length], life: 1 });
  }
  if (particles.length === 160) requestAnimationFrame(tick);
}
function tick() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter((p) => p.life > 0 && p.y < canvas.height + 40);
  for (const p of particles) {
    p.vy += 0.28; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.006;
    ctx.save(); ctx.globalAlpha = Math.max(p.life, 0); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
  }
  if (particles.length) requestAnimationFrame(tick);
}

// ---------- Warteschlange, damit mehrere Check-ins nacheinander laufen ----------
const stage = document.getElementById('stage');
const queue = [];
let busy = false;

function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function next() {
  if (busy || !queue.length) return;
  busy = true;
  const ev = queue.shift();
  stage.innerHTML = `<div class="card" style="animation-duration:${duration}ms">
      <div class="icon">✅</div>
      <div class="name">${esc(ev.user)}</div>
      <div class="sub">ist eingecheckt – Besuch <b>#${ev.count}</b></div>
    </div>`;
  playSound();
  burst();
  await new Promise((r) => setTimeout(r, duration + 300));
  stage.innerHTML = '';
  busy = false;
  next();
}

// ---------- Verbindung zum Server ----------
const es = new EventSource('/events');
es.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === 'checkin') { queue.push(ev); next(); }
};
</script>
</body>
</html>
