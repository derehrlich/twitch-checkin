<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stadtwache Alpakas</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* Alpaka-Leiste als OBS-Browserquelle (z. B. 1920×160, Hintergrund bleibt durchsichtig).
     Jede Person, die im Chat schreibt, läuft als Pixel-Alpaka am unteren Rand. Gesteuert wird im Admin (Reiter „Alpakas“).
     ?demo  Beispiel-Alpakas   ?scale=2  Größe (1 bis 10)   ?names=0  ohne Namen */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #field { position: fixed; inset: 0; }
  .alp { position: absolute; bottom: 0; will-change: transform; transition: opacity .6s; }
  .alp.gone { opacity: 0; }
  .alp .sprite { display: block; image-rendering: pixelated; transform-origin: 50% 100%; }
  .alp.left .sprite { transform: scaleX(-1); }
  .alp.pop .sprite { animation: pop .7s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  .alp.left.pop .sprite { animation-name: popl; }
  @keyframes popl { 0% { transform: scaleX(-1) scale(0); } 100% { transform: scaleX(-1) scale(1); } }
  .alp .name { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 700 15px/1 var(--wordmark); color: #fff3da; text-shadow: 1px 1px 0 #2b180c, -1px 1px 0 #2b180c, 1px -1px 0 #2b180c, -1px -1px 0 #2b180c; }
  .spark { position: absolute; width: 6px; height: 6px; background: #ffe98a; pointer-events: none; animation: spark 1s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
</style>
</head>
<body>
<div id="field"></div>
<script>
const params = new URLSearchParams(location.search);
const SCALE = Math.min(10, Math.max(1, Number(params.get('scale')) || 2));
const NAMES = params.get('names') !== '0';
const field = document.getElementById('field');

// ---- Pixel-Alpaka, flauschig und schattiert. Blick nach rechts. Der Körper wird aus Formen berechnet (Körper, Hals, Kopf mit Schopf,
// Ohren, Schnauze, Schwanz). Der unruhige Rand und die Wolltupfen kommen von einem festen Zufall je Pixel, so sieht das Alpaka
// immer gleich aus. Beine, Umriss und Schatten entstehen je Bild neu (siehe draw), dadurch läuft es.
const W = 40, H = 41;
const GROUND = 37; // letzte Pixelreihe der Hufe
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) ^ 0x5bd1e995; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
const ell = (x, y, cx, cy, rx, ry, fluff = 0.3) => { const d = Math.hypot((x - cx) / rx, (y - cy) / ry); return d < 1 + (hash(x, y) - 0.5) * fluff ? (y - cy) / ry : null; };

// Welcher Teil liegt an diesem Pixel? Ergebnis: { part, ny (oben -1 … unten +1) } oder null
// Schlank gezeichnet: kleiner Körper, langer dünner Hals, kleiner Kopf mit Schopf, lange Beine.
function sample(x, y) {
  let v;
  if ((v = ell(x, y, 32, 12.2, 2.7, 2, 0.15)) !== null) return { part: 'snout', ny: v };
  if ((v = ell(x, y, 26, 6.8, 1.0, 2.3, 0.1)) !== null || (v = ell(x, y, 29.6, 6.5, 1.0, 2.3, 0.1)) !== null) return { part: 'ear', ny: v };
  if ((v = ell(x, y, 28.6, 10.7, 3.7, 3.2, 0.3)) !== null || (v = ell(x, y, 27.6, 7.9, 3.5, 2.5, 0.5)) !== null) return { part: 'head', ny: v }; // Gesicht und Haarschopf
  if (y >= 12 && y <= 27) { // Hals: schlank, unten etwas breiter, nach vorn geneigt
    const t = (26 - y) / 14, cx = 21 + 5.5 * t, hw = 3.7 - 1.1 * t;
    const dx = (x - cx) / hw;
    if (Math.abs(dx) < 1 + (hash(x, y) - 0.5) * 0.35) return { part: 'neck', ny: dx };
  }
  if ((v = ell(x, y, 14.5, 26, 10, 6, 0.26)) !== null) return { part: 'body', ny: v };
  if ((v = ell(x, y, 4.5, 22, 2.2, 2.8, 0.5)) !== null) return { part: 'tail', ny: v };
  return null;
}

// ---- Farben
const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
const parse = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
const mix = (rgb, to, t) => rgb.map((v, i) => clamp(v + (to[i] - v) * t));
const css = (rgb) => `rgb(${rgb.join(',')})`;
const STEPS = [-0.34, -0.2, -0.08, 0, 0.1, 0.2];
const shade = (base, s) => css(mix(base, s < 0 ? [18, 8, 10] : [255, 250, 240], Math.abs(s)));
const snap = (s) => STEPS.reduce((best, v) => (Math.abs(v - s) < Math.abs(best - s) ? v : best), 0);

// Zeichnet den Körper einmal je Farbe (ohne Beine): Raster aus Farben, null = leer
function makeSprite(hex) {
  const base = parse(/^#[0-9a-f]{6}$/i.test(hex) ? hex : '#d9c3a0');
  const lum = (0.299 * base[0] + 0.587 * base[1] + 0.114 * base[2]) / 255;
  const body = Array.from({ length: H }, () => Array(W).fill(null));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const p = sample(x, y);
    if (!p) continue;
    const n = hash(x + 91, y + 17);
    let s = -0.16 * p.ny - 0.04; // Licht von oben
    if (p.part === 'neck') s = -0.14 * p.ny + 0.02; // links heller, rechts dunkler
    if (p.part === 'ear') { body[y][x] = css(mix(base, [255, 170, 160], 0.35)); continue; }
    if (p.part === 'snout') { body[y][x] = shade(mix(base, [240, 196, 110], 0.65), snap(-0.12 * p.ny)); continue; }
    s += n > 0.8 ? 0.13 : n < 0.2 ? -0.12 : 0; // Wolltupfen
    body[y][x] = shade(base, snap(s));
  }
  body[10][30] = '#18100e'; body[11][30] = '#18100e'; // Auge
  body[12][34] = '#2a1a16'; // Nase
  const leg = [mix(base, [90, 60, 44], 0.3), mix(base, [60, 38, 28], 0.5)]; // vorderes und hinteres Bein
  return {
    body, lum,
    outline: css(lum < 0.2 ? mix(base, [255, 255, 255], 0.3) : mix(base, [20, 8, 6], 0.68)),
    legs: leg.map((c) => [css(c), css(mix(c, [0, 0, 0], 0.25)), css([34, 20, 16])]), // Beinfarbe, Schatten, Huf
  };
}

// ---- Gang
// Beine: [x, hinten/vorn Schicht, Phase]. Diagonal laufen: hinten-nah und vorn-fern gleich, die anderen versetzt.
const LEGS = [[7, 1, 2], [18, 1, 0], [10, 0, 0], [21, 0, 2]];
const DX = [1, 0, -1, 0], LIFT = [0, 0, 0, 1];
const BOB = [0, 1, 0, 1];
const IDLE = 4;

function draw(ctx, spr, frame) {
  const grid = Array.from({ length: H }, () => Array(W).fill(null));
  const bob = frame === IDLE ? 0 : BOB[frame];
  const put = (x, y, c) => { if (x >= 0 && x < W && y >= 0 && y < H) grid[y][x] = c; };
  for (const [x0, layer, shift] of LEGS) { // Beine zuerst, der Körper deckt ihren Ansatz ab
    const p = frame === IDLE ? 1 : (frame + shift) % 4;
    const dx = frame === IDLE ? 0 : DX[p], lift = frame === IDLE ? 0 : LIFT[p];
    const [c, sh, hoof] = spr.legs[layer];
    for (let y = 29; y <= GROUND; y++) {
      const low = y >= 33;
      const x = x0 + (low ? dx : 0), yy = y - (low ? lift : 0);
      put(x, yy, y === GROUND ? hoof : c); put(x + 1, yy, y === GROUND ? hoof : sh);
    }
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (spr.body[y][x] && y + bob < H) grid[y + bob][x] = spr.body[y][x];

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(20, 10, 5, .28)'; // Schatten am Boden
  [8, 11, 8].forEach((half, i) => ctx.fillRect(14 - half, GROUND + 1 + i, half * 2, 1));
  const at = (x, y) => (grid[y]?.[x] ?? null);
  for (let y = -1; y <= H; y++) for (let x = -1; x <= W; x++) {
    let c = at(x, y);
    if (!c) {
      if (!at(x - 1, y) && !at(x + 1, y) && !at(x, y - 1) && !at(x, y + 1)) continue;
      c = spr.outline; // dunkler Umriss um alles, was Fell ist
    }
    ctx.fillStyle = c; ctx.fillRect(x, y, 1, 1);
  }
}

// ---- Verhalten: jedes Alpaka schlendert, bleibt ab und zu stehen und dreht um
const alpacas = new Map(); // id -> { el, ctx, pal, x, dir, speed, pause, frame, color, name }
const rnd = (a, b) => a + Math.random() * (b - a);
const pw = () => W * SCALE;

function spawn(a) {
  const el = document.createElement('div');
  el.className = 'alp pop';
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H; canvas.className = 'sprite';
  canvas.style.width = `${W * SCALE}px`; canvas.style.height = `${H * SCALE}px`;
  el.append(canvas);
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.style.bottom = `${(H - 5) * SCALE}px`;
  if (!NAMES) nameEl.style.display = 'none';
  el.append(nameEl);
  field.append(el);
  const o = { el, ctx: canvas.getContext('2d'), nameEl, x: rnd(0, Math.max(1, innerWidth - pw())), dir: Math.random() < .5 ? -1 : 1, speed: rnd(14, 34), pause: rnd(0, 3), frame: -1, t: 0, color: null, name: '' };
  alpacas.set(a.id, o);
  setTimeout(() => el.classList.remove('pop'), 800);
  return o;
}

function sparkle(o) {
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = `${o.x + pw() / 2}px`; s.style.bottom = `${H * SCALE / 2}px`;
    const ang = (i / 10) * Math.PI * 2, d = rnd(30, 70);
    s.style.setProperty('--dx', `${Math.cos(ang) * d}px`); s.style.setProperty('--dy', `${Math.sin(ang) * d}px`);
    field.append(s);
    setTimeout(() => s.remove(), 1000);
  }
}

function sync(list) {
  const ids = new Set(list.map((a) => a.id));
  for (const a of list) {
    const o = alpacas.get(a.id) ?? spawn(a);
    if (o.name !== a.name) { o.name = a.name; o.nameEl.textContent = a.name; }
    if (o.color !== a.color) {
      const first = o.color === null;
      o.color = a.color; o.spr = makeSprite(a.color);
      if (!first) sparkle(o); // Farbe wurde gerade gewechselt
      draw(o.ctx, o.spr, o.frame);
    }
  }
  for (const [id, o] of alpacas) if (!ids.has(id)) {
    alpacas.delete(id);
    o.el.classList.add('gone');
    setTimeout(() => o.el.remove(), 700);
  }
}

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const maxX = Math.max(0, innerWidth - pw());
  for (const o of alpacas.values()) {
    let f;
    if (o.pause > 0) { o.pause -= dt; f = IDLE; }
    else {
      o.x += o.dir * o.speed * dt;
      if (o.x <= 0) { o.x = 0; o.dir = 1; } else if (o.x >= maxX) { o.x = maxX; o.dir = -1; }
      if (Math.random() < dt * 0.15) o.pause = rnd(1.5, 5); // bleibt kurz stehen
      else if (Math.random() < dt * 0.08) o.dir *= -1; // dreht um
      o.t += dt;
      f = Math.floor(o.t / 0.2) % 4;
    }
    if (f !== o.frame && o.spr) { o.frame = f; draw(o.ctx, o.spr, f); }
    o.el.style.transform = `translateX(${o.x}px)`;
    o.el.classList.toggle('left', o.dir < 0);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---- Daten
const DEMO = [
  ['Anna', '#ff8fc0'], ['Ben', '#27c9c0'], ['Cleo', '#f1e6d0'], ['Dennis', '#a14ee8'], ['EhrlichVerwirrt', '#d9c3a0'],
  ['Fiona', '#e03a3a'], ['Gero', '#3b3430'], ['Hanna', '#ffd93d'], ['Ivo', '#3a7bff'], ['Jule', '#3fbf5f'],
].map(([name, color], i) => ({ id: 'd' + i, name, color }));

async function poll() {
  try {
    if (params.has('demo')) return sync(DEMO);
    const res = await fetch('/api/alpakas', { cache: 'no-store' });
    if (res.ok) sync((await res.json()).alpacas ?? []);
  } catch { /* beim nächsten Mal wieder */ }
}
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
