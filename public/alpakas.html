<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stadtwache Alpakas</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* Alpaka-Leiste als OBS-Browserquelle (z. B. 1920×160, Hintergrund bleibt durchsichtig).
     Jede Person, die im Chat schreibt, läuft als Pixel-Alpaka am unteren Rand. Gesteuert wird im Admin (Reiter „Alpakas“).
     ?demo  Beispiel-Alpakas   ?scale=1.5  Größe (0.5 bis 10)   ?names=0  ohne Namen */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #field { position: fixed; inset: 0; }
  .alp { position: absolute; bottom: 0; will-change: transform; transition: opacity .6s; }
  .alp.gone { opacity: 0; }
  .alp .sprite { display: block; image-rendering: pixelated; transform-origin: 50% 100%; }
  .alp.left .sprite { transform: scaleX(-1); }
  .alp.pop .sprite { animation: pop .7s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
  .alp.left.pop .sprite { animation-name: popl; }
  @keyframes popl { 0% { transform: scaleX(-1) scale(0); } 100% { transform: scaleX(-1) scale(1); } }
  .alp .name { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 700 15px/1 var(--wordmark); color: #fff3da; text-shadow: 1px 1px 0 #2b180c, -1px 1px 0 #2b180c, 1px -1px 0 #2b180c, -1px -1px 0 #2b180c; }
  .spark { position: absolute; width: 6px; height: 6px; background: #ffe98a; pointer-events: none; animation: spark 1s ease-out forwards; }
  @keyframes spark { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
</style>
</head>
<body>
<div id="field"></div>
<script>
const params = new URLSearchParams(location.search);
const SCALE = Math.min(10, Math.max(0.5, Number(params.get('scale')) || 1.5));
const NAMES = params.get('names') !== '0';
const field = document.getElementById('field');

// ---- Pixel-Alpaka aus dem Bogen /img/alpaka-walk.png: 4 Laufbilder nebeneinander (je 39×63 Pixel), Blick nach rechts.
// Das Fell wird je Person in der gekauften Farbe eingefärbt, die Decke und die Hufe bleiben, wie sie sind.
const FW = 39, FH = 63, N = 4, IDLE = 4, IDLE_FRAME = 3;
const W = FW, H = FH + 3; // drei Reihen darunter für den Schatten
const SHEET = new Image();
const sheetReady = new Promise((res) => { SHEET.onload = res; SHEET.onerror = res; SHEET.src = '/img/alpaka-walk.png'; });
let sheetData = null; // Bildpunkte des Bogens

const parse = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));

// Fell oder Decke? Die Decke ist kräftig gefärbt und hell genug, alles andere (Fell, Beine, Ohren, Umriss) ist Fell.
function isBlanket(r, g, b, y) {
  if (y < 30 || y > 47) return false; // die Decke liegt auf dem Rücken, Kopf, Hals und Beine sind immer Fell
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  return mx > 0 && (mx - mn) / mx > 0.5 && mx > 120;
}

// Je Farbe einmal: vier eingefärbte Laufbilder
const spriteCache = new Map();
function makeSprite(hex) {
  const key = /^#[0-9a-f]{6}$/i.test(hex) ? hex.toLowerCase() : '#d9c3a0';
  if (spriteCache.has(key)) return spriteCache.get(key);
  const [tr, tg, tb] = parse(key);
  const frames = [];
  for (let f = 0; f < N; f++) {
    const c = document.createElement('canvas'); c.width = FW; c.height = FH;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(FW, FH);
    for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) {
      const i = (y * FW + x) * 4, j = (y * (FW * N) + f * FW + x) * 4;
      const [r, g, b, a] = [sheetData[j], sheetData[j + 1], sheetData[j + 2], sheetData[j + 3]];
      img.data[i + 3] = a;
      if (!a) continue;
      if (isBlanket(r, g, b, y)) { img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; continue; }
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      const k = Math.min(1.08, lum / 232); // Helligkeit des Pixels im cremefarbenen Original -> Schattierung der neuen Farbe
      img.data[i] = Math.min(255, tr * k); img.data[i + 1] = Math.min(255, tg * k); img.data[i + 2] = Math.min(255, tb * k);
    }
    ctx.putImageData(img, 0, 0);
    frames.push(c);
  }
  const spr = { frames };
  spriteCache.set(key, spr);
  return spr;
}

function draw(ctx, spr, frame) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(20, 10, 5, .28)'; // Schatten am Boden
  [[0, 22], [1, 28], [2, 22]].forEach(([i, w]) => ctx.fillRect(Math.round((FW - w) / 2), FH - 1 + i, w, 1));
  ctx.drawImage(spr.frames[frame === IDLE || frame < 0 ? IDLE_FRAME : frame], 0, 0);
}

// ---- Verhalten: jedes Alpaka schlendert, bleibt ab und zu stehen und dreht um
const alpacas = new Map(); // id -> { el, ctx, pal, x, dir, speed, pause, frame, color, name }
const rnd = (a, b) => a + Math.random() * (b - a);
const pw = () => W * SCALE;

function spawn(a) {
  const el = document.createElement('div');
  el.className = 'alp pop';
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H; canvas.className = 'sprite';
  canvas.style.width = `${W * SCALE}px`; canvas.style.height = `${H * SCALE}px`;
  el.append(canvas);
  const nameEl = document.createElement('div');
  nameEl.className = 'name';
  nameEl.style.bottom = `${H * SCALE + 2}px`;
  if (!NAMES) nameEl.style.display = 'none';
  el.append(nameEl);
  field.append(el);
  const o = { el, ctx: canvas.getContext('2d'), nameEl, x: rnd(0, Math.max(1, innerWidth - pw())), dir: Math.random() < .5 ? -1 : 1, speed: rnd(18, 40), pause: rnd(0, 3), frame: -1, t: 0, color: null, name: '' };
  alpacas.set(a.id, o);
  setTimeout(() => el.classList.remove('pop'), 800);
  return o;
}

function sparkle(o) {
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = `${o.x + pw() / 2}px`; s.style.bottom = `${H * SCALE / 2}px`;
    const ang = (i / 10) * Math.PI * 2, d = rnd(30, 70);
    s.style.setProperty('--dx', `${Math.cos(ang) * d}px`); s.style.setProperty('--dy', `${Math.sin(ang) * d}px`);
    field.append(s);
    setTimeout(() => s.remove(), 1000);
  }
}

function sync(list) {
  const ids = new Set(list.map((a) => a.id));
  for (const a of list) {
    const o = alpacas.get(a.id) ?? spawn(a);
    if (o.name !== a.name) { o.name = a.name; o.nameEl.textContent = a.name; }
    if (o.color !== a.color) {
      const first = o.color === null;
      o.color = a.color; o.spr = makeSprite(a.color);
      if (!first) sparkle(o); // Farbe wurde gerade gewechselt
      draw(o.ctx, o.spr, o.frame);
    }
  }
  for (const [id, o] of alpacas) if (!ids.has(id)) {
    alpacas.delete(id);
    o.el.classList.add('gone');
    setTimeout(() => o.el.remove(), 700);
  }
}

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const maxX = Math.max(0, innerWidth - pw());
  for (const o of alpacas.values()) {
    let f;
    if (o.pause > 0) { o.pause -= dt; f = IDLE; }
    else {
      o.x += o.dir * o.speed * dt;
      if (o.x <= 0) { o.x = 0; o.dir = 1; } else if (o.x >= maxX) { o.x = maxX; o.dir = -1; }
      if (Math.random() < dt * 0.15) o.pause = rnd(1.5, 5); // bleibt kurz stehen
      else if (Math.random() < dt * 0.08) o.dir *= -1; // dreht um
      o.t += dt;
      f = Math.floor(o.t / 0.18) % N;
    }
    if (f !== o.frame && o.spr) { o.frame = f; draw(o.ctx, o.spr, f); }
    o.el.style.transform = `translateX(${o.x}px)`;
    o.el.classList.toggle('left', o.dir < 0);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---- Daten
const DEMO = [
  ['Anna', '#ff8fc0'], ['Ben', '#27c9c0'], ['Cleo', '#f1e6d0'], ['Dennis', '#a14ee8'], ['EhrlichVerwirrt', '#d9c3a0'],
  ['Fiona', '#e03a3a'], ['Gero', '#3b3430'], ['Hanna', '#ffd93d'], ['Ivo', '#3a7bff'], ['Jule', '#3fbf5f'],
].map(([name, color], i) => ({ id: 'd' + i, name, color }));

async function poll() {
  try {
    if (params.has('demo')) return sync(DEMO);
    const res = await fetch('/api/alpakas', { cache: 'no-store' });
    if (res.ok) sync((await res.json()).alpacas ?? []);
  } catch { /* beim nächsten Mal wieder */ }
}
sheetReady.then(() => {
  const c = document.createElement('canvas'); c.width = FW * N; c.height = FH;
  const cx = c.getContext('2d'); cx.drawImage(SHEET, 0, 0);
  sheetData = cx.getImageData(0, 0, FW * N, FH).data;
  poll();
  setInterval(poll, 5000);
});
</script>
</body>
</html>
