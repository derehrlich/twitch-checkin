<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stadtwache Rangliste</title>
<meta name="description" content="Die treuesten Zuschauer: Besuche, Streaks und Zeit im Stream.">
<meta name="color-scheme" content="dark light">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="/stadtwache.css">
<style>
  /* Öffentliche Rangliste, z. B. als Link in einem Twitch-Panel. ?overlay  transparent und ohne Kopf (für eine OBS-Browserquelle) */
  body.overlay { background: transparent; overflow: hidden; }
  body.overlay header { display: none; }
  main { max-width: 1040px; margin: 0 auto; padding: 28px 20px 48px; display: grid; gap: 20px; }
  body.overlay main { padding: 16px; max-width: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
  section.card { padding: 20px 22px 22px; }
  ol { list-style: none; margin: 0; padding: 0; counter-reset: r; }
  li { counter-increment: r; display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rand); }
  li:last-child { border-bottom: 0; }
  li::before { content: counter(r); width: 26px; flex: none; text-align: right; font-weight: 700; font-size: .9rem; color: var(--leise); }
  li:nth-child(1)::before { content: '🥇'; } li:nth-child(2)::before { content: '🥈'; } li:nth-child(3)::before { content: '🥉'; }
  li b { margin-left: auto; font-weight: 700; white-space: nowrap; color: var(--gelb); }
  li span { overflow-wrap: anywhere; }
  section.month { grid-column: 1 / -1; }
  details.legend { margin-top: 14px; border-top: 1px solid var(--rand); padding-top: 12px; }
  details.legend summary { cursor: pointer; font-weight: 700; color: var(--leise); }
  details.legend ul { margin: 10px 0 0; padding-left: 1.2em; display: grid; gap: 6px; }
  details.legend li { display: list-item; counter-increment: none; border: 0; padding: 0; list-style: none; margin-left: -1.2em; padding-left: 1.2em; }
  details.legend li::before { content: none; }
  .foot { text-align: center; color: var(--leise); font-size: .9rem; margin: 0; }
  body.overlay .foot { display: none; }
  @media (max-width: 640px) { main { padding: 18px 14px 40px; } .brand img { display: none; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="/img/lama.png" alt="" onerror="this.remove()"><div><small>EhrlichVerwirrt</small><h1>Stadtwache Rangliste</h1></div></div>
  <button type="button" id="thema" class="leise thema" aria-label="Hell oder dunkel umschalten" title="Hell / Dunkel">🌓</button>
</header>
<main>
  <div class="grid" id="grid"></div>
  <p class="foot" id="foot"></p>
</main>
<script src="/thema.js" defer></script>
<script>
if (new URLSearchParams(location.search).has('overlay')) document.body.classList.add('overlay');
const fmtMin = (m) => { m = Math.round(m); return m < 60 ? `${m} Min` : m % 60 ? `${Math.floor(m / 60)} Std ${m % 60} Min` : `${Math.floor(m / 60)} Std`; };
const BOARDS = [
  ['visits', 'Anwesende – meiste Besuche', (v) => `${v}x`],
  ['chatters', 'Aktivste Chatter', (v) => `${v} Nachrichten`],
  ['streaks', 'Aktuelle Streak 🔥', (v) => `${v} Streams`],
  ['records', 'Streak-Rekord', (v) => `${v} Streams`],
  ['minutes', 'Meiste Zeit im Stream', fmtMin],
];
const grid = document.getElementById('grid');
// Legende zur Monatsrangliste: was wie viele Punkte bringt und ab wann gedeckelt wird
function legend(r) {
  const gap = r.msgGap % 60 === 0 && r.msgGap >= 60 ? `${r.msgGap / 60} Minute${r.msgGap === 60 ? '' : 'n'}` : `${r.msgGap} Sekunden`;
  const perDay = 2 * (r.msgCap * r.msg + r.day) + r.checkin;
  const det = document.createElement('details'); det.className = 'legend';
  const sum = document.createElement('summary'); sum.textContent = 'So werden die Punkte gezählt'; det.append(sum);
  const ul = document.createElement('ul');
  const items = [
    `💬 Nachricht: ${r.msg} Punkt${r.msg === 1 ? '' : 'e'}. Twitch-Chat und Discord zählen getrennt. Eine Nachricht zählt höchstens alle ${gap}.`,
    `🛑 Deckel: pro Tag und Plattform zählen höchstens ${r.msgCap} Nachrichten, also höchstens ${r.msgCap * r.msg} Punkte. Mehr schreiben bringt an dem Tag keine weiteren Punkte.`,
    `📅 Aktiver Tag: ${r.day} Punkte für jeden Tag, an dem du geschrieben hast (Twitch und Discord je einmal).`,
    `✅ Check-in im Stream: ${r.checkin} Punkte für jeden Stream-Tag.`,
  ];
  if (r.bonusNote) items.push(`🎁 ${r.bonusNote}`);
  items.push(`📈 Ohne Bonus sind etwa ${perDay} Punkte pro Tag das Höchste (aktiv auf beiden Plattformen und eingecheckt).`);
  items.push('🔄 Am Monatsanfang beginnt die Wertung neu. Wer vorne liegt, kommt in die Hall of Fame im Discord.');
  for (const t of items) { const li = document.createElement('li'); li.textContent = t; ul.append(li); }
  det.append(ul); return det;
}
async function load() {
  try {
    const res = await fetch('/api/leaderboard', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status === 404 ? 'Die Rangliste ist gerade nicht öffentlich.' : 'Die Rangliste konnte nicht geladen werden.');
    const data = await res.json();
    grid.replaceChildren();
    if (data.month) { // Monatsrangliste: nur verknüpfte Konten, mit Hinweis wie man mitmacht
      const sec = document.createElement('section'); sec.className = 'card month';
      const h = document.createElement('h2'); h.textContent = `Aktivste im ${data.month.label}`; sec.append(h);
      if (data.month.rows.length) {
        const ol = document.createElement('ol');
        for (const row of data.month.rows) {
          const li = document.createElement('li');
          const name = document.createElement('span'); name.textContent = row.name;
          const val = document.createElement('b'); val.textContent = `${row.value} Punkte`;
          li.append(name, val); ol.append(li);
        }
        sec.append(ol);
      } else { const p = document.createElement('p'); p.className = 'muted'; p.textContent = 'Noch keine Punkte in diesem Monat.'; sec.append(p); }
      if (data.month.hint) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = data.month.hint; const a = document.createElement('a'); a.href = '/verknuepfen'; a.textContent = ' Mehr dazu'; p.append(a); sec.append(p); }
      if (data.month.rules) sec.append(legend(data.month.rules));
      grid.append(sec);
    }
    for (const [key, title, fmt] of BOARDS) {
      const sec = document.createElement('section'); sec.className = 'card';
      const h = document.createElement('h2'); h.textContent = title; sec.append(h);
      const ol = document.createElement('ol');
      for (const row of data[key]) {
        const li = document.createElement('li');
        const name = document.createElement('span'); name.textContent = row.name;
        const val = document.createElement('b'); val.textContent = fmt(row.value);
        li.append(name, val); ol.append(li);
      }
      if (!data[key].length) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = 'Noch keine Einträge.'; sec.append(p); } else sec.append(ol);
      grid.append(sec);
    }
    document.getElementById('foot').textContent = `${data.visitors} Besucher insgesamt · aktualisiert ${new Date(data.updated).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr`;
  } catch (e) {
    grid.replaceChildren(); const p = document.createElement('p'); p.className = 'foot'; p.textContent = e.message; grid.append(p);
  }
}
load(); setInterval(load, 60_000);
</script>
</body>
</html>
