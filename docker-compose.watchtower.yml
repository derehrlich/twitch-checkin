# Automatische Updates für die Stadtwache. In CasaOS: App-Store → „Benutzerdefinierte App installieren“ → diese Datei einfügen. Nur einmal nötig.
# Watchtower schaut alle 5 Minuten, ob es ein neueres Image gibt (nach jedem Merge in main baut GitHub eins) und startet die Stadtwache
# dann mit denselben Einstellungen neu. Es berührt nur Apps mit dem Etikett „com.centurylinklabs.watchtower.enable=true“, sonst nichts.
# Die Daten der Stadtwache liegen im Ordner /DATA/AppData/stadtwache/data und bleiben dabei erhalten.
name: watchtower
services:
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Europe/Berlin
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
x-casaos:
  architectures:
    - amd64
  main: watchtower
  author: Marcel Ehrlich
  category: Twitch
  description:
    de_de: Hält die Stadtwache automatisch aktuell
    en_us: Keeps Stadtwache up to date automatically
  title:
    custom: Watchtower
  port_map: ""
  index: /
